name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint + unit test + build — dış bağımlılık gerektirmez, her PR'da koşar
  quality:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Unit testler
        run: npm test

      # Sezgisel bir tarama: t() dışında kalmış olabilecek Türkçe metinleri
      # listeler ve yanlış pozitif üretebilir. Bu yüzden BLOKLAMIYOR — envanter
      # aracı olarak PR çıktısında görünüyor, eşiği yok (bkz. scripts/i18n-audit.mjs).
      - name: i18n envanteri (bloklamaz)
        run: npm run i18n:audit
        continue-on-error: true

      # Build, .env olmadan da geçmeli: supabase.js artık modül seviyesinde
      # throw etmiyor, yapılandırma eksikse uygulama kurulum ekranı gösteriyor.
      - name: Build
        run: npm run build

  # E2E gerçek bir Supabase projesi + demo hesap gerektirir.
  # Secret'lar tanımlı değilse (fork PR'ları) sessizce atlanır.
  e2e:
    name: Cypress E2E
    runs-on: ubuntu-latest
    needs: quality
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      CYPRESS_DEMO_EMAIL: ${{ secrets.CYPRESS_DEMO_EMAIL }}
      CYPRESS_DEMO_PASSWORD: ${{ secrets.CYPRESS_DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Secret kontrolü
        id: secrets
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "Supabase secret'ları tanımlı değil — E2E atlanıyor."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.skip == 'false'
        with:
          node-version: '22'
          cache: npm

      - name: Bağımlılıklar
        if: steps.secrets.outputs.skip == 'false'
        run: npm ci

      # Üretim derlemesine karşı koşuyor, dev sunucusuna değil: canlıda
      # görünen bir hata (SPA yönlendirmesi) dev'de görünmüyordu.
      # Tarayıcı Chrome, çünkü dil sabitleme cypress.config.js'te
      # before:browser:launch ile yapılıyor ve Electron o argümanı yok sayıyor.
      - name: Cypress
        if: steps.secrets.outputs.skip == 'false'
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: chrome
          build: npm run build
          start: npm run preview
          wait-on: 'http://localhost:4173'
          wait-on-timeout: 120
        env:
          CYPRESS_baseUrl: http://localhost:4173

      - name: Başarısız testlerin ekran görüntüleri
        if: failure() && steps.secrets.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
